<ul class="list-group shadow">
    {% for movie in movies %}
        <li class="list-group-item list-group-item-action d-flex align-items-center">
            <img src="{{ movie.img_url }}" style="width: 40px; height: 50px; object-fit: cover;" class="me-3">
            <div>
                <a href="{{ url_for('core.detail', id=movie.id) }}" class="text-decoration-none text-dark fw-bold">
                    {{ movie.name }}
                </a>
                <br>
                <small class="text-muted">{{ movie.director }}</small>
            </div>
        </li>
    {% else %}
        {% if q %}
            <li class="list-group-item text-muted">ไม่พบข้อมูล...</li>
        {% endif %}
    {% endfor %}
</ul>
